[package]
name = "tilewright-render-sdl3"
description = "Thin SDL3 native-surface adapter for the Tilewright renderer"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = ["crates-io"]

[dependencies]
tilewright-render-api.workspace = true
tilewright-render-wgpu.workspace = true
sdl3.workspace = true
wgpu.workspace = true

# SDL's Window deliberately remains thread-bound, while wgpu requires its raw
# handle source to implement Send + Sync. The bridge isolates and documents the
# sole unsafe assertion; every other workspace crate denies unsafe code.
