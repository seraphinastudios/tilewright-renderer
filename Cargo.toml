[workspace]
members = [
  "crates/tilewright-render",
  "crates/tilewright-render-api",
  "crates/tilewright-render-resources",
  "crates/tilewright-render-sdl3",
  "crates/tilewright-render-testkit",
  "crates/tilewright-render-ui",
  "crates/tilewright-render-wgpu",
  "crates/tilewright-render-world",
  "crates/tilewright-scene",
]
resolver = "3"

[workspace.package]
authors = ["Seraphina Studios"]
description = "Clean-room shared rendering foundations for Tilewright"
edition = "2024"
license = "MIT"
repository = "https://github.com/seraphinastudios/tilewright-renderer"
rust-version = "1.97.1"
version = "0.2.0"

[workspace.dependencies]
tilewright-render-api = { path = "crates/tilewright-render-api", version = "=0.2.0" }
tilewright-render-resources = { path = "crates/tilewright-render-resources", version = "=0.2.0" }
tilewright-render-sdl3 = { path = "crates/tilewright-render-sdl3", version = "=0.2.0" }
tilewright-render-testkit = { path = "crates/tilewright-render-testkit", version = "=0.2.0" }
tilewright-render-ui = { path = "crates/tilewright-render-ui", version = "=0.2.0" }
tilewright-render-wgpu = { path = "crates/tilewright-render-wgpu", version = "=0.2.0" }
tilewright-render-world = { path = "crates/tilewright-render-world", version = "=0.2.0" }
tilewright-scene = { path = "crates/tilewright-scene", version = "=0.2.0" }
bytemuck = { version = "1.25.2", features = ["derive"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18.1"
pollster = "1.0.1"
sdl3 = { version = "0.20.0", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
