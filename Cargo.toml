[workspace]
members = [
  "crates/tilewright-render",
  "crates/tilewright-render-api",
  "crates/tilewright-render-resources",
  "crates/tilewright-render-sdl3",
  "crates/tilewright-render-testkit",
  "crates/tilewright-render-ui",
  "crates/tilewright-render-web",
  "crates/tilewright-render-wgpu",
  "crates/tilewright-render-world",
  "crates/tilewright-scene",
]
resolver = "3"

[workspace.package]
authors = ["Seraphina Studios"]
description = "Clean-room shared rendering foundations for Tilewright"
edition = "2024"
license = "MIT"
repository = "https://github.com/seraphinastudios/tilewright-renderer"
rust-version = "1.97.1"
version = "0.6.1"

[workspace.dependencies]
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
unicode-segmentation = "=1.13.3"
unicode-script = "0.5.8"
tilewright-render-api = { path = "crates/tilewright-render-api", version = "=0.6.1" }
tilewright-render-resources = { path = "crates/tilewright-render-resources", version = "=0.6.1" }
tilewright-render-sdl3 = { path = "crates/tilewright-render-sdl3", version = "=0.6.1" }
tilewright-render-testkit = { path = "crates/tilewright-render-testkit", version = "=0.6.1" }
tilewright-render-ui = { path = "crates/tilewright-render-ui", version = "=0.6.1" }
tilewright-render-wgpu = { path = "crates/tilewright-render-wgpu", version = "=0.6.1", default-features = false }
tilewright-render-world = { path = "crates/tilewright-render-world", version = "=0.6.1" }
tilewright-scene = { path = "crates/tilewright-scene", version = "=0.6.1" }
bytemuck = { version = "1.25.2", features = ["derive"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18.1"
pollster = "1.0.1"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
sdl3 = { version = "0.20.0", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
serde_core = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

# Browser bundles: smallest code, whole-program optimisation.
[profile.web]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
