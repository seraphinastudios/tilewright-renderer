name: Publish verified renderer crates

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish exact source-release archives
        type: choice
        options: [automatic]
        default: automatic
        required: true
      source_release_id:
        description: Exact GitHub source release ID
        type: string
        required: true
      source_revision:
        description: Full source revision
        type: string
        required: true
      manifest_sha256:
        description: SHA-256 of the owning crate manifest
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: renderer-crate-publication
  cancel-in-progress: false

jobs:
  automatic-verify:
    if: github.repository == 'seraphinastudios/tilewright-renderer' && github.repository_id == '1327106998' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'automatic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    env:
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ inputs.source_release_id }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: >-
          python3 tools/crate_release.py verify --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"

  automatic-publish:
    needs: automatic-verify
    if: github.repository == 'seraphinastudios/tilewright-renderer' && github.repository_id == '1327106998' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'automatic'
    environment: crates-io-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: read
      id-token: write
    env:
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_RELEASE_ID: ${{ inputs.source_release_id }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: >-
          python3 tools/crate_release.py verify --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - id: upload
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_INTENT_TOKEN: ${{ github.token }}
          TILEWRIGHT_PUBLISH_RECEIPTS: ${{ runner.temp }}/crate-put-outcomes
        run: >-
          python3 tools/crate_release.py upload --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Preserve bounded registry PUT outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-put-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crate-put-outcomes/*.json
          if-no-files-found: warn
          retention-days: 90
      - if: ${{ !cancelled() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        run: >-
          python3 tools/crate_release.py confirm --release-id "$SOURCE_RELEASE_ID"
          --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256"
