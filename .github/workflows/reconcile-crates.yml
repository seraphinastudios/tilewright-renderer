name: Reconcile renderer crate releases

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: renderer-crate-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'seraphinastudios/tilewright-renderer' && github.repository_id == '1327106998' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch the next incomplete exact-byte release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/crate_release.py reconcile
