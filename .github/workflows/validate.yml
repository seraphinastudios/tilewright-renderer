name: Renderer validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: renderer-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # tools/validate.sh runs every part in order locally; here each part runs
  # in its own job, in parallel.
  validate:
    name: Validate ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part:
          - native
          - web-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: /tmp/tilewright-renderer-cargo
      CARGO_TARGET_DIR: /tmp/tilewright-renderer-target
      TRIVY_CACHE_DIR: /tmp/tilewright-renderer-trivy
      CRATE_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node for the browser package
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: Install pinned validation dependencies
        run: tools/install-ci-dependencies.sh

      - name: Fetch the complete locked cross-target graph
        run: cargo fetch --locked

      - name: Validate renderer contracts and release
        env:
          VALIDATION_PART: ${{ matrix.part }}
        run: tools/validate.sh "${VALIDATION_PART}"

      # The browser package's npm install is in this part's tree, as it was
      # when one job ran every part before the scan.
      - name: Scan locked dependencies
        if: matrix.part == 'web-and-release'
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --ignore-unfixed .

  # The required check. It needs every job above and passes only when each
  # one succeeded: a failed, skipped or cancelled job fails it. Add every
  # new job to `needs`, or this check passes without it.
  result:
    name: Renderer validation
    needs:
      - validate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null
