name: Renderer validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: renderer-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Renderer validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: /tmp/tilewright-renderer-cargo
      CARGO_TARGET_DIR: /tmp/tilewright-renderer-target
      TRIVY_CACHE_DIR: /tmp/tilewright-renderer-trivy
      CRATE_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node for the browser package
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: Install pinned validation dependencies
        run: tools/install-ci-dependencies.sh

      - name: Fetch the complete locked cross-target graph
        run: cargo fetch --locked

      - name: Validate renderer contracts and release
        run: tools/validate.sh

      - name: Scan locked dependencies
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --ignore-unfixed .
