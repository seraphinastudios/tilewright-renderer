name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: read

concurrency:
  group: renderer-semantic-release
  cancel-in-progress: false

jobs:
  source-package:
    name: Prepare renderer release without publication credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
    env:
      CARGO_HOME: /tmp/tilewright-renderer-cargo
      CARGO_TARGET_DIR: /tmp/tilewright-renderer-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - name: Install pinned release dependencies
        run: tools/install-ci-dependencies.sh
      - name: Fetch the complete locked cross-target graph
        run: cargo fetch --locked
      - name: Revalidate exact release revision
        run: tools/validate.sh
      - name: Verify release branch policy
        run: node scripts/release/test-release-policy.cjs
      - name: Install pinned commit analysis without lifecycle scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/crate-analysis" --ignore-scripts --no-audit --no-fund
          @semantic-release/commit-analyzer@13.0.1
          conventional-changelog-conventionalcommits@9.3.1 semver@7.7.3
      - name: Check source version planning
        env:
          NODE_PATH: ${{ runner.temp }}/crate-analysis/node_modules
        run: node scripts/release/test-source-version.mjs
      - name: Plan source version without publication authorization
        id: plan
        env:
          NODE_PATH: ${{ runner.temp }}/crate-analysis/node_modules
          TILEWRIGHT_RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release/source-version.mjs > "$RUNNER_TEMP/source-plan.json"
          revision=$(jq -r '.revision' "$RUNNER_TEMP/source-plan.json")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          version=$(jq -r '.version // empty' "$RUNNER_TEMP/source-plan.json")
          if [ -n "$version" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare complete exact-byte source release
        if: steps.plan.outputs.release == 'true'
        env:
          SOURCE_VERSION: ${{ steps.plan.outputs.version }}
        run: tools/package-release.sh build/release "$SOURCE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true'
        with:
          name: prepared-renderer-release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest verified renderer source release manifest
    needs: source-package
    if: needs.source-package.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source-package.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: prepared-renderer-release-${{ github.sha }}
          path: build/release/
      - name: Verify complete inert payload before attestation
        env:
          TILEWRIGHT_RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_SOURCE_REVISION: ${{ needs.source-package.outputs.revision }}
          EXPECTED_SOURCE_VERSION: ${{ needs.source-package.outputs.version }}
        run: >-
          python3 tools/crate_release.py finalize --source-tag "v${EXPECTED_SOURCE_VERSION}"
          --archives build/release
      - name: Bind manifest bytes to this exact source workflow invocation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/crate-release.json
          push-to-registry: false

  release:
    name: Release renderer
    needs: [source-package, attest]
    if: needs.source-package.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source-package.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: prepared-renderer-release-${{ github.sha }}
          path: build/release
      - name: Install pinned release dependencies without lifecycle scripts
        run: |
          npm install --prefix "${RUNNER_TEMP}/semantic-release" \
            --ignore-scripts --no-audit --no-fund --package-lock=false \
            semantic-release@25.0.9 @semantic-release/exec@7.1.0 @semantic-release/github@12.0.6 \
            conventional-changelog-conventionalcommits@9.3.1
          NODE_PATH="${RUNNER_TEMP}/semantic-release/node_modules" node scripts/release/test-git-auth.mjs
      - name: Analyze commits, verify prepared evidence, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
          TILEWRIGHT_RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_SOURCE_REVISION: ${{ needs.source-package.outputs.revision }}
          EXPECTED_SOURCE_VERSION: ${{ needs.source-package.outputs.version }}
        run: '"${RUNNER_TEMP}/semantic-release/node_modules/.bin/semantic-release"'
